services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: meal_planner_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL.}
      POSTGRES_USER: meal_planner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - meal_planner_postgres_data:/var/lib/postgresql/data

volumes:
  meal_planner_postgres_data:
