plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'expo.modules.mealplannerwidgets'
    compileSdk 37
    defaultConfig {
        applicationId 'com.example.mealplanner.widgetintegration'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    sourceSets {
        main {
            manifest.srcFile '../../../android/src/main/AndroidManifest.xml'
            java.srcDirs=["$buildDir/widget-sources"]
            res.srcDirs=['../../../android/src/main/res']
        }
        androidTest.java.srcDirs=['../../../android/src/androidTest/java']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget='17' }
}
// Copy the real files verbatim; no alternate test implementation or Expo dependency.
def copyWidgetSources=tasks.register('copyWidgetSources',Copy) {
    from '../../../android/src/main/java'
    include '**/WidgetCore.kt','**/MealPlannerWidget.kt'
    into layout.buildDirectory.dir('widget-sources')
}
tasks.named('preBuild') { dependsOn copyWidgetSources }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
