buildscript {
  repositories { mavenCentral() }
  dependencies { classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}") }
}
apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
group = 'expo.modules.mealplannerwidgets'
version = '1.0.0'
android {
  namespace 'expo.modules.mealplannerwidgets'
  defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
  buildFeatures { compose true }
  compileOptions { coreLibraryDesugaringEnabled true }
}
dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
