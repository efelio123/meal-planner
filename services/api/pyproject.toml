[project]
name = "meal-planner-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "efelio123", email = "efelio123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "clerk-backend-api>=6.0.0",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
meal-planner-api = "meal_planner_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
